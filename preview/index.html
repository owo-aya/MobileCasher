<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到账预览</title>
<link rel="stylesheet" href="receipt.css">
<main>
  <div class="stage">
    <article id="receipt" aria-label="收款详情">
      <button type="button" class="wechat-back wx-only" aria-label="返回首屏"><svg width="13" height="21" viewBox="0 0 13 21" aria-hidden="true"><path d="M11 2 3 10.5 11 19" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <header>
        <img id="avatar" width="58" height="58" alt="">
        <div id="payer"></div>
        <div class="success-mark wx-only" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m13 24 8 8 15-16" fill="none" stroke="currentColor" stroke-width="3.4"/></svg></div>
        <p class="success-copy wx-only">你已收款，资金已存入零钱</p>
        <h1 id="amount"></h1>
        <p class="balance-caption wx-only">零钱余额</p>
        <p id="status">交易成功</p>
      </header>
      <dl id="details"></dl>
      <footer class="bill-caption wx-only">账单详情</footer>
    </article>
    <div id="intro" aria-hidden="true">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" focusable="false"><path class="ticket" d="M8 4h16v24l-4-2-4 2-4-2-4 2z"/><path class="chat" d="M3 14c0-6 5-10 13-10s13 4 13 10-5 10-13 10l-4-1-6 4 1-7c-2-2-4-4-4-6z"/><path class="tick" d="m11 14 3 3 7-7"/></svg>
      </span>
      <span class="intro-label"></span>
      <div class="money-slip">
        <img id="sender-avatar" alt="">
        <div class="slip-heading">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="ticket" d="M5 3h14v18l-3-2-4 2-4-2-3 2z M8 10l3 3 5-6"/><path class="chat" d="M3 12a9 8 0 1 1 5 7l-4 2 1-5z M8 12l3 3 5-6"/></svg>
          <span id="slip-label"></span>
        </div>
        <span id="first-amount"></span>
        <svg class="transfer-symbol" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/><path d="M28 17H12l5-5m-5 11h16l-5 5"/></svg>
        <span class="transfer-prompt">请收款</span>
        <span class="transfer-footer">微信转账</span>
      </div>
    </div>
  </div>
  <form aria-label="预览选项" onsubmit="return false">
    <fieldset id="variants" aria-label="首屏方案">
      <label><input type="radio" name="variant" value="platform">平台回执</label>
      <label><input type="radio" name="variant" value="person">角色先行</label>
      <label><input type="radio" name="variant" value="money" checked>金额先行</label>
    </fieldset>
    <select id="platform" aria-label="收款平台">
      <option value="alipay">支付宝</option><option value="wechat">微信</option>
    </select>
    <select id="theme" aria-label="界面主题">
      <option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
    </select>
    <button type="button" id="replay">重播到账</button>
    <label class="hold"><input type="checkbox" id="hold">停在首屏</label>
  </form>
</main>
<script src="receipt.js"></script>
</html>
